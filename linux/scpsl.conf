# BEGIN VOID PROJECT SCP-SL
# This block is appended to /opt/zapret2/config by SCP-SL-Linux.sh.
# It intentionally implements:
#   Game Filter = enabled (TCP and UDP)
#   IPSet Filter = any  -> MODE_FILTER=none

FWTYPE=__FWTYPE__
MODE_FILTER=none

NFQWS2_ENABLE=1
NFQWS2_PORTS_TCP=80,443,1024-65535
NFQWS2_PORTS_UDP=443,1024-65535

# Limit packet processing to the beginning of each connection.
NFQWS2_TCP_PKT_OUT=20
NFQWS2_TCP_PKT_IN=10
NFQWS2_UDP_PKT_OUT=5
NFQWS2_UDP_PKT_IN=3

# Keep both address families enabled. SCP:SL/Cloudflare may use either one.
DISABLE_IPV4=0
DISABLE_IPV6=0

# HARD profile for SCP:SL central HTTPS/QUIC plus high-port game traffic.
NFQWS2_OPT='
--filter-tcp=80 --filter-l7=http --payload=http_req --lua-desync=fake:blob=fake_default_http:tcp_md5 --lua-desync=multisplit:pos=method+2 --new
--filter-tcp=443 --filter-l7=tls --payload=tls_client_hello --lua-desync=fake:blob=fake_default_tls:tcp_md5:tcp_seq=-10000:repeats=8 --lua-desync=multidisorder:pos=1,midsld --new
--filter-udp=443 --filter-l7=quic --payload=quic_initial --lua-desync=fake:blob=fake_default_quic:repeats=6 --new
--filter-tcp=1024-65535 --payload=known,unknown --lua-desync=multisplit --new
--filter-udp=1024-65535 --payload=known,unknown --lua-desync=fake:blob=0x00000000000000000000000000000000:repeats=2:payload=all
'
# END VOID PROJECT SCP-SL
